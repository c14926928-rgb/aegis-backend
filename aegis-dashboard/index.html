<!DOCTYPE html>
<html>
<head>
<title>Aegis Monitoring</title>
</head>
<body style="background:#0b0b0f;color:white">

<h2>Live Monitoring</h2>

<div id="grid"></div>

<script>
async function load() {

    const res = await fetch("http://localhost:3000/api/frames");
    const data = await res.json();

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (const player in data) {

        const div = document.createElement("div");

        div.innerHTML = `
            <h4>${player}</h4>
            <img src="http://localhost:3000${data[player]}" width="200"/>
        `;

        grid.appendChild(div);
    }
}

setInterval(load, 1000);
</script>

</body>
</html>
